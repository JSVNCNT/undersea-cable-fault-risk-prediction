# Deploy manually only after reviewing website/DEPLOYMENT.md.
# No account resources or paid plans are created by this local file.
services:
  - type: web
    name: undersea-research-api
    runtime: python
    plan: free
    rootDir: website/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: ALLOWED_ORIGINS
        sync: false
  - type: web
    name: undersea-research-web
    runtime: static
    rootDir: website
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: VITE_DATA_MODE
        value: bundled
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
